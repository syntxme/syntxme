# Faollik va servislar holati har 6 soatda yangilanadi.
name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [generate.py, .github/workflows/update.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "profile: update"
          git push
